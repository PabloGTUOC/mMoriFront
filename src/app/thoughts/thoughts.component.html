<div class="thoughts-container">
  <h2>How are you feeling today?</h2>
  <div class="mood-options">
    <button *ngFor="let mood of moods"
            class="mood-button"
            (click)="selectMood(mood.mood)">
      <span class="emoji">{{ mood.emoji }}</span>
      {{ mood.label }}
    </button>
  </div>

  <div *ngIf="selectedMood" class="selected-mood">
    <h3>You are feeling: {{ selectedMood | titlecase }}</h3>
  </div>

  <!--
    Rendered as data, not markup: no [innerHTML], so there is no HTML to sanitise even
    though the text comes from a model whose output nobody controls.
  -->
  <div *ngIf="recommendationBlocks.length" class="recommendation">
    <h3>Today's Recommendation</h3>
    <ng-container *ngFor="let block of recommendationBlocks">
      <p *ngIf="block.kind === 'paragraph'">
        <ng-container *ngFor="let segment of block.segments">
          <strong *ngIf="segment.bold">{{ segment.text }}</strong>
          <ng-container *ngIf="!segment.bold">{{ segment.text }}</ng-container>
        </ng-container>
      </p>
      <ul *ngIf="block.kind === 'list'">
        <li *ngFor="let item of block.items">
          <ng-container *ngFor="let segment of item">
            <strong *ngIf="segment.bold">{{ segment.text }}</strong>
            <ng-container *ngIf="!segment.bold">{{ segment.text }}</ng-container>
          </ng-container>
        </li>
      </ul>
    </ng-container>
  </div>
</div>
