<div class="info-block">
  <div>
    <h3>Age</h3>
    <p class="value">{{ currentAge }}</p>
  </div>
  <div>
    <h3>Weight</h3>
    <p class="value">{{ weight }}</p>
  </div>
  <div>
    <h3>BMI</h3>
    <p class="value">{{ bmi }}</p>
  </div>
  <div>
    <h3>BMI Status:</h3>
    <p class="value">{{ bmiStatus }}</p>
  </div>
  <div>
    <h3>#Days Trained</h3>
    <p class="value">{{ totalDaysTrained }}</p>
  </div>
  <div>
    <h3>% Days Trained</h3>
    <p class="value">{{ percentageDaysTrained }}%</p>
  </div>
</div>
<!--
  These headings open the life chart, so they need to be reachable and operable by
  keyboard. Kept as <h2> with button semantics rather than swapped for <button> elements,
  so the existing styling is untouched. Full dialog semantics are plan item 6.4.
-->
<div class="weeks-left">
  <h2
    role="button"
    tabindex="0"
    [attr.aria-expanded]="isChartVisible"
    (click)="toggleLifeExpectancyChart()"
    (keydown.enter)="toggleLifeExpectancyChart()"
    (keydown.space)="toggleLifeExpectancyChart()"
  >Weeks Already gone: {{ weeksGone }}</h2>
  <h2
    role="button"
    tabindex="0"
    [attr.aria-expanded]="isChartVisible"
    (click)="toggleLifeExpectancyChart()"
    (keydown.enter)="toggleLifeExpectancyChart()"
    (keydown.space)="toggleLifeExpectancyChart()"
  >Weeks Left to Live: {{ weeksLeftToLive }}</h2>
</div>
<!--
  The weight history chart was a complete, polished component that nothing ever rendered —
  the API only exposed the latest weight, so it had no data source until /weight_updates/history.
-->
<app-weight-history-chart [weightData]="weightHistory"></app-weight-history-chart>

<!--
  A real dialog (6.4): role/aria-modal so assistive tech treats it as one, cdkTrapFocus to
  keep Tab inside it and restore focus on close, Escape to dismiss, and a real <button> for
  the close control rather than a clickable <span>.
-->
<div
  *ngIf="isChartVisible"
  class="modal"
  role="dialog"
  aria-modal="true"
  aria-labelledby="life-chart-title"
  (keydown.escape)="toggleLifeExpectancyChart()"
>
  <div class="modal-content" cdkTrapFocus [cdkTrapFocusAutoCapture]="true">
    <button
      type="button"
      class="close-btn"
      aria-label="Close life expectancy chart"
      (click)="toggleLifeExpectancyChart()"
    >&times;</button>
    <h3 id="life-chart-title">Life Expectancy Chart</h3>
    <app-life-expectancy-chart
      [currentAge]="currentAge"
      [weeksLeftToLive]="weeksLeftToLive">
    </app-life-expectancy-chart>
  </div>
</div>
