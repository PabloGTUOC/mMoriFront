<div class="training-repository-container">
  <h2>Training Repository</h2>

  <p *ngIf="loading()">Loading trainings…</p>
  <p *ngIf="error()" class="catalogue-error" role="alert">{{ error() }}</p>

  <div *ngIf="items().length; else noTrainings" class="training-grid">
    <app-training-item
      *ngFor="let training of items(); trackBy: trackById"
      [training]="training"
    ></app-training-item>
  </div>
  <ng-template #noTrainings>
    <p *ngIf="!loading()">No trainings available.</p>
  </ng-template>

  <!--
    Two ways to fill a catalogue that is now yours alone: write one, or take a copy of
    someone else's. The search panel is shared between both catalogues.
  -->
  <div class="catalogue-actions">
    <button type="button" (click)="toggleDiscovery()">
      {{ showDiscovery() ? 'Close search' : 'Search other users' }}
    </button>
    <button type="button" (click)="toggleAddForm()">
      {{ showAddForm() ? 'Cancel' : 'Add New Training' }}
    </button>
  </div>

  <app-catalogue-discovery
    *ngIf="showDiscovery()"
    [entries]="discovered()"
    [loading]="discovering()"
    [error]="discoveryError()"
    [importingId]="importing()"
    [itemLabel]="itemLabel"
    (search)="search($event)"
    (import)="importItem($any($event))"
  ></app-catalogue-discovery>

  <form *ngIf="showAddForm()" [formGroup]="form" (ngSubmit)="submit()">
    <label for="trainingName">Training Name:</label>
    <input type="text" id="trainingName" formControlName="name" required>

    <label for="type">Type:</label>
    <input type="text" id="type" formControlName="type" required>

    <label for="duration">Duration (mins):</label>
    <input type="number" id="duration" formControlName="duration" required min="1">

    <label for="calories">Calories Burned:</label>
    <input type="number" id="calories" formControlName="calories" required min="1">

    <label for="description">Description:</label>
    <textarea id="description" formControlName="description" required></textarea>

    <button type="submit" [disabled]="form.invalid">Submit</button>
  </form>
</div>
