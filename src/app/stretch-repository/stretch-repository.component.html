<div class="stretch-repository-container">
  <h2>Stretches</h2>

  <p *ngIf="loading()">Loading stretches…</p>
  <p *ngIf="error()" class="catalogue-error" role="alert">{{ error() }}</p>

  <div *ngIf="items().length; else noStretches" class="stretch-grid">
    <app-stretch-item
      *ngFor="let stretch of items(); trackBy: trackById"
      [stretch]="stretch"
    ></app-stretch-item>
  </div>
  <ng-template #noStretches>
    <p *ngIf="!loading()">No stretches available.</p>
  </ng-template>

  <button type="button" (click)="toggleAddForm()">
    {{ showAddForm() ? 'Cancel' : 'Add New Stretch' }}
  </button>

  <form *ngIf="showAddForm()" [formGroup]="form" (ngSubmit)="submit()">
    <label for="stretch_name">Stretch Name</label>
    <input id="stretch_name" formControlName="name" />
    <label for="description">Description</label>
    <input id="description" formControlName="description" />
    <label for="video_link">YouTube Link</label>
    <input id="video_link" formControlName="video_link" />

    <button type="submit" [disabled]="form.invalid">Submit</button>
  </form>
</div>
