<form [formGroup]="userForm" (ngSubmit)="onSubmit()">
  <label for="dob">Date of Birth:</label>
  <input type="date" id="dob" formControlName="dob" required>

  <label for="gender">Gender:</label>
  <mat-form-field appearance="fill">
    <mat-label>Gender</mat-label>
    <mat-select id="gender" formControlName="gender" required>
      <mat-option value="male">Male</mat-option>
      <mat-option value="female">Female</mat-option>
      <mat-option value="other">Other</mat-option>
    </mat-select>
  </mat-form-field>

  <label for="height">Height (cm):</label>
  <input type="number" id="height" formControlName="height" required>

  <label for="weight">Weight (kg):</label>
  <input type="number" id="weight" formControlName="weight" required>

  <label for="trainingFrequency">Training Frequency (times per week):</label>
  <input type="number" id="trainingFrequency" formControlName="trainingFrequency" required>

  <label for="smoker">Do you smoke?</label>
  <input type="checkbox" id="smoker" formControlName="smoker">

  <label for="drinker">Do you drink?</label>
  <input type="checkbox" id="drinker" formControlName="drinker">

  <label for="country">Country:</label>
  <mat-form-field appearance="fill">
    <mat-label>Country</mat-label>
    <mat-select id="country" formControlName="country_code" required>
      <mat-option *ngFor="let country of countries" [value]="country.Country_Code">
        {{ country.Country }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <button type="submit" [disabled]="userForm.invalid">Submit</button>
</form>
