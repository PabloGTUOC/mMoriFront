<form>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob" required>

    <label for="gender">Gender:</label>
    <select id="gender" name="gender" required>
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
    </select>

    <label for="height">Height (cm):</label>
    <input type="number" id="height" name="height" required>

    <label for="weight">Weight (kg):</label>
    <input type="number" id="weight" name="weight" required>

    <label for="training-frequency">Training Frequency (times per week):</label>
    <input type="number" id="training-frequency" name="training-frequency" required>

    <label for="smoker">Do you smoke?</label>
    <input type="checkbox" id="smoker" name="smoker">

    <label for="drinker">Do you drink?</label>
    <input type="checkbox" id="drinker" name="drinker">

    <button type="submit">Submit</button>
</form>
