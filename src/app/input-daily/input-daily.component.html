<div class="input-block">
  <h2>Input Daily Data</h2>
  <form [formGroup]="dailyForm" (ngSubmit)="submitData()">
    <div class="form-container">
        <label for="trainingSelect">Have you trained today?</label>
          <select id="trainingSelect" formControlName="training" required>
            <option value="" disabled>Select training</option>
            <!-- Dynamically populate trainings from the DB -->
            <option *ngFor="let training of trainings(); trackBy: trackById" [value]="training.name">
              {{ training.name }} - {{ training.type }}
            </option>
          </select>
        <label for="weightInput">Current Weight (kg):</label>
        <input type="number" id="weightInput" class="weightInput" formControlName="weight" required min="0">
      <p
        *ngIf="dailyForm.get('training')?.touched && dailyForm.get('training')?.invalid"
        class="field-error"
        role="alert"
      >Pick the training you did today.</p>
      <p
        *ngIf="dailyForm.get('weight')?.touched && dailyForm.get('weight')?.invalid"
        class="field-error"
        role="alert"
      >Enter your current weight in kilograms.</p>

      <button type="submit" [disabled]="dailyForm.invalid">Submit</button>
    </div>
  </form>
</div>
