<div class="stretch-item">
  <h3>{{ stretch.name }}</h3>
  <p>{{ stretch.description }}</p>
  <!-- Embedding YouTube Video -->
  <iframe
    *ngIf="embedUrl() as src; else noVideo"
    width="100%"
    height="315"
    [src]="src"
    title="Stretch demonstration video"
    frameborder="0"
    allowfullscreen
  ></iframe>
  <ng-template #noVideo>
    <p class="no-video">No video available for this stretch.</p>
  </ng-template>
</div>
